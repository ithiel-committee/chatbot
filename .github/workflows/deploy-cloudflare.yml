name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured. Skipping deployment."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install canvas dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          : > .env.local
          if [ -n "$CLOUDFLARE_ENV_FILE" ]; then
            printf '%s\n' "$CLOUDFLARE_ENV_FILE" >> .env.local
          fi
          if [ -n "$CLOUDFLARE_PUBLIC_ENV_APPEND" ]; then
            printf '\n%s\n' "$CLOUDFLARE_PUBLIC_ENV_APPEND" >> .env.local
          fi
          upsert_env_secret() {
            key="$1"
            value="$2"
            tmp_file="$(mktemp)"
            grep -v "^${key}=" .env.local > "$tmp_file" || true
            mv "$tmp_file" .env.local
            if [ -z "$value" ]; then
              return
            fi
            printf '%s=%s\n' "$key" "$value" >> .env.local
          }
          upsert_env_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          upsert_env_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          upsert_env_secret CUSTOM_API_URL "$CUSTOM_API_URL"
          upsert_env_secret CUSTOM_API_HEADERS "$CUSTOM_API_HEADERS"
          if ! grep -q '^AITUBERKIT_SERVER_SECRET_ACCESS_MODE=' .env.local; then
            printf '%s\n' 'AITUBERKIT_SERVER_SECRET_ACCESS_MODE=demo' >> .env.local
          fi
          if ! grep -q '^AITUBERKIT_ALLOWED_ORIGINS=' .env.local; then
            printf '%s\n' 'AITUBERKIT_ALLOWED_ORIGINS=https://aituberkit.com,https://www.aituberkit.com' >> .env.local
          fi
          if ! grep -q '^AITUBERKIT_DEMO_RATE_LIMIT_PER_MINUTE=' .env.local; then
            printf '%s\n' 'AITUBERKIT_DEMO_RATE_LIMIT_PER_MINUTE=20' >> .env.local
          fi
          if ! grep -q '^AITUBERKIT_TRUST_PROXY_HEADERS=' .env.local; then
            printf '%s\n' 'AITUBERKIT_TRUST_PROXY_HEADERS=true' >> .env.local
          fi
          node scripts/normalize-cloudflare-env.js .env.local
        env:
          CLOUDFLARE_ENV_FILE: ${{ secrets.CLOUDFLARE_ENV_FILE }}
          CLOUDFLARE_PUBLIC_ENV_APPEND: ${{ secrets.CLOUDFLARE_PUBLIC_ENV_APPEND }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CUSTOM_API_URL: ${{ secrets.CUSTOM_API_URL }}
          CUSTOM_API_HEADERS: ${{ secrets.CUSTOM_API_HEADERS }}

      - name: Build for Cloudflare
        run: pnpm run build:cloudflare
        env:
          NEXT_PUBLIC_OFFICIAL_SITE: 'true'

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .cloudflare-runtime-secrets.json
