name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install canvas dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: |
          set -o pipefail
          pnpm run test:coverage --coverageReporters=text-summary 2>&1 | tee test-output.log

      - name: Add coverage to job summary
        if: always()
        run: |
          {
            echo '## Test Coverage'
            echo '```'
            grep -A 6 'Coverage summary' test-output.log || echo 'Coverage summary not found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install canvas dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Chrome browser
        run: google-chrome --version

      - name: List E2E tests
        run: pnpm run test:e2e --list

      - name: Run E2E tests
        env:
          E2E_PORT: '3200'
        run: pnpm run test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install canvas dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Chrome browser
        run: google-chrome --version

      - name: List production E2E tests
        run: pnpm run test:e2e:production --list

      - name: Run production E2E smoke
        env:
          E2E_PORT: '3201'
        run: pnpm run test:e2e:production

      - name: Upload production Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-production
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload production Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-e2e-production
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
