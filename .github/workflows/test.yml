name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install canvas dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: |
          set -o pipefail
          pnpm run test:coverage --coverageReporters=text-summary 2>&1 | tee test-output.log

      - name: Add coverage to job summary
        if: always()
        run: |
          {
            echo '## Test Coverage'
            echo '```'
            grep -A 6 'Coverage summary' test-output.log || echo 'Coverage summary not found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
